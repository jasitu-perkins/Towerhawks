<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Voting Leaderboard</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bar-transition { transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <!-- Changed to a <main> tag for better document semantics -->
    <main class="w-full max-w-2xl bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        
        <div class="p-6 md:p-8">
            <!-- Voting Leaderboard -->
            <section>
                <!-- Changed to h1 for iframe context -->
                <h1 class="text-xl font-bold text-gray-800 border-b pb-2 mb-6">Current Standings</h1>
                
                <!-- ADDED: tabindex="0" for keyboard scrolling and aria-live="polite" for dynamic updates -->
                <div id="leaderboard-container" 
                     class="space-y-6 max-h-96 overflow-y-auto pr-4 scrollbar-thin scrollbar-thumb-gray-300 scrollbar-track-transparent"
                     tabindex="0"
                     aria-live="polite"
                     aria-busy="true">
                    <!-- Placeholder loading state -->
                    <div class="animate-pulse flex space-x-4">
                        <div class="flex-1 space-y-4 py-1">
                            <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                            <div class="space-y-2">
                                <div class="h-4 bg-gray-200 rounded"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * Configuration
         */
        // This is the URL to your Render backend
        const RENDER_BACKEND_URL = 'https://gfm-backend-6lb2.onrender.com/api/leaderboard';

        // UI Elements
        const leaderboardContainer = document.getElementById('leaderboard-container');

        function renderLeaderboard(data) {
            // Data has loaded, tell screen readers it is no longer busy
            leaderboardContainer.setAttribute('aria-busy', 'false');

            // Sort votes from highest to lowest
            const sortedVotes = data.votes.sort((a, b) => b.votes - a.votes);
            
            // Clear loading placeholder
            leaderboardContainer.innerHTML = '';

            // Get total votes to calculate fractions and percentages
            const rawTotalVotes = sortedVotes.reduce((sum, item) => sum + item.votes, 0);

            // Render each option
            sortedVotes.forEach((item) => {
                // Calculate percentage (default to 0 if no votes exist yet)
                const rawPercentage = rawTotalVotes === 0 ? 0 : (item.votes / rawTotalVotes) * 100;
                const displayPercentage = Math.round(rawPercentage);
                
                // Fallback color if not provided
                const barColor = item.color || 'bg-gray-600';

                // Added ARIA labels and improved contrast for accessibility 
                const itemHTML = `
                    <div class="flex flex-col mb-4">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-sm font-bold text-gray-800">${item.option}</span>
                            <span class="text-sm font-bold text-gray-900">${displayPercentage}%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden shadow-inner" 
                             role="progressbar" 
                             aria-label="Vote percentage for ${item.option}" 
                             aria-valuenow="${displayPercentage}" 
                             aria-valuemin="0" 
                             aria-valuemax="100">
                            <div class="${barColor} h-3 rounded-full bar-transition" style="width: 0%;" data-target-width="${rawPercentage}%"></div>
                        </div>
                    </div>
                `;
                
                leaderboardContainer.insertAdjacentHTML('beforeend', itemHTML);
            });

            // Animate leaderboard bars
            setTimeout(() => {
                const bars = leaderboardContainer.querySelectorAll('.bar-transition');
                bars.forEach(bar => {
                    bar.style.width = bar.getAttribute('data-target-width');
                });
            }, 150);
        }

        async function fetchCampaignData() {
            try {
                // This fetches from YOUR custom backend on Render
                const response = await fetch(RENDER_BACKEND_URL);
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                const data = await response.json();
                renderLeaderboard(data);
            } catch (error) {
                // Fails silently in console but alerts the user in the UI
                leaderboardContainer.innerHTML = `
                    <div class="bg-red-50 text-red-700 p-4 rounded-lg text-sm text-center font-medium border border-red-200" role="alert">
                        Unable to load leaderboard data right now. Please try again later.
                    </div>
                `;
            }
        }

        // Initialize on load
        window.onload = () => {
            fetchCampaignData();
            
            // Optional: Auto-refresh every 5 minutes (300000 ms)
            // setInterval(fetchCampaignData, 300000);
        };
    </script>
</body>
</html>
